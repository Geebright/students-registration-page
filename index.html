
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Page</title>
</head>
<body>
    <header>
        <h1>Student Registration Form</h1>
    </header>

    <main>
        <section>
            <h2>Register</h2>
            <form action="#" method="POST">

                
                    <h3>Your Personal Information</h3>
                    
                    <div>
                        <label for="FirstName">Name:</label>
                        <input type="text" id="FirstName" name="FirstName" placeholder="Enter your first name" required>
                    </div><br>

                    <div>
                        <label for="MiddleName">Middle Name (Optional):</label>
                        <input type="text" id="MiddleName" name="MiddleName" placeholder="Enter your middle name" required>
                    </div><br>

                    <div>
                        <label for="LastName">Last Name (Surname):</label>
                        <input type="text" id="LastName" name="Last" placeholder="Enter your last name" required>
                    </div><br>

                    <div>
                        <label for="gender">Gender:</label>
                        <input type="radio" id="male" name="gender" value="male" required>
                        <label for="male">Male</label>
                        <input type="radio" id="female" name="gender" value="female">
                        <label for="female">Female</label>

                    </div><br>

                    <div>
                        <label for="phone">Phone Number:</label>
                        <input type="tel" id="phone" name="phone" required>
                    </div><br>

                    <div>
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" required>
                    </div><br>
                

                
                    <h3>Academic Information</h3>

                    <div>
                        <label for="matricNo">Matric Number:</label>
                        <input type="text" id="MatricNo" name="MatricNo" required>
                    </div><br>

                    <div>
                        <label for="department">Department:</label>
                        <select id="department" name="department" required>
                            <option value="">Select Department</option>
                            <option value="computer science">Computer Science</option>
                            <option value="ITCT">Information Technology and Information Communication Technology</option>
                            <option value="CSDS"> Cyber Security and Data Science </option>
                            <option value="SEIS"> Software Engineering and Information Systems</option>
                        </select>

                    </div><br>

                    <div>
                        <label for="programme">Programme:</label>
                        <select id="programme" name="programme" required>
                            <option value="">Select Programme</option>
                            <option value="full-time">Full-time</option>
                            <option value="weekday">Weekday</option>
                            <option value="weekday">Weekend</option>
                        </select>
                    </div><br>
                
            </form>
        </section>    
    </main>
</body>
